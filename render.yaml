services:
  - type: web
    name: datashop-api
    env: python
    runtime: python3.11
    rootDir: backend/datashop
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: datashop-db
          property: connectionString
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: VTPASS_API_KEY
        sync: false

databases:
  - name: datashop-db
    plan: free
