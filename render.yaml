services:
  - type: web
    name: datashop-api
    env: python
    rootDir: backend/datashop
    buildCommand: |
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: datashop-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://datashop-api-production.up.railway.app,https://your-frontend.vercel.app"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_BASE_URL
        value: "https://vtpass.com/api"
      - key: PLATFORM_NAME
        value: "Datashop"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: REFERRAL_BONUS_AMOUNT
        value: "500"
      - key: MIN_WALLET_FUNDING
        value: "100"

databases:
  - name: datashop-db
    plan: free
